<!DOCTYPE html>
<html lang="en">
<head>
    <title>Function expression and arrow function</title>
</head>
<body>
<h2>Function expression and arrow function</h2>
<script>
    const getStringLength=function(str){
        return str.length;
    };
    const getSquare=(num)=>{
        return num*num;
    };
    let lengthResult=getStringLength("Javascript");
    let squareResult=getSquare(6);
    console.log("Length of the string:",lengthResult);
    console.log("Square of the number:",squareResult);
</script>
</body>
</html>
