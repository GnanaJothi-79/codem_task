<!DOCTYPE html>
<html lang="en">
<head>
    <title>IIFE</title>
</head>
<body>
<h2>Immediately Invoked Function</h2>
<script>
    (function(){
        let number=10;         
        let result=number*5; 
        console.log("Result from IIFE:",result);
    })();
    // console.log(number);  number is not defined
</script>

</body>
</html>
