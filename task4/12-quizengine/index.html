<!DOCTYPE html>
<html>
<head>
    <title>Quiz Engine</title>
    <style>
        button {
            display: block;
            margin: 8px 0;
            padding: 8px;
            width: 200px;
        }
    </style>
</head>
<body>
<h2>Quiz engine</h2>
<div id="quizContainer"></div>
<h3 id="score"></h3>
<script>
    let quiz=[
        { question:"What is JavaScript?",options:["Language","Framework","Database"],answer:"Language"},
        {question:"Which keyword declares a variable?",options:["var","loop","print"],answer:"var"  }
    ];
    let currentQuestion=0;
    let score=0;
    function showQuestion() {
        let container=document.getElementById("quizContainer");
        container.innerHTML="";
        if (currentQuestion>=quiz.length){
            container.innerHTML="<h3>Quiz finished</h3>";
            document.getElementById("score").innerText="Final Score: "+score+" / "+quiz.length;
            return;
        }
        let q=quiz[currentQuestion];
        let question=document.createElement("h3");
        question.innerText=q.question;
        container.appendChild(question);
        for (let i=0;i<q.options.length;i++) {
            let btn=document.createElement("button");
            btn.innerText=q.options[i];
            btn.onclick=function(){
                checkAnswer(q.options[i]);
            };
            container.appendChild(btn);
        }
    }
    function checkAnswer(selected){
        if (selected===quiz[currentQuestion].answer){
            score++;
        }
        currentQuestion++;
        showQuestion();
    }
    showQuestion();
</script>
</body>
</html>
