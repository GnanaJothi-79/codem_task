<p>Open the browser console to see the message</p>
<script>
let fullname="Gnana Jothi";
let uppercase=fullname.toUpperCase();
let lowercase=fullname.toLowerCase();
let name=fullname.replace(" ","");
let namelength=name.length;
let firstname=fullname.split(" ")[0];
console.log("--String Processing--\n");
console.log("Original Name: "+fullname);
console.log("Uppercase: "+uppercase);
console.log("Lowercase: "+lowercase);
console.log("Length of Name(Without space): "+namelength);
console.log("Firstname: "+firstname);
</script>
