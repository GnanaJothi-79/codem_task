<p>Open the browser console to see the message</p>
<script>
let num1=12;
let num2=4;
let addition=num1+num2;
let subtraction=num1-num2;
let multiplication=num1*num2;
let division=num1/num2;
let modulus=num1%num2;
let power=num1**num2;
console.log("--ARITHMETIC OPERATIONS--\n");
console.log("Addition of "+num1+" and "+num2+"  is "+addition);
console.log("Subtraction of "+num2+" from "+num1+" is "+subtraction);
console.log("Multiplication of "+num1+" and "+num2+" is "+multiplication);
console.log("Division of "+num1+" by "+num2+" is "+division);
console.log("Remainder of "+num1+" by "+num2+" is "+modulus);
console.log("Power ( "+num1+" ^ "+num2+" ) is "+power);
</script>
