<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Time Form Validation</title>
    <style>
        .invalid {
            border:2px solid rgb(255, 0, 0);
        }
    </style>
</head>
<body>
    <form id="formId">
        <input type="text" id="username" placeholder="Username:">
        <span id="userError"></span><br><br>
        <input type="email" id="email" placeholder="Email:">
        <span id="emailError"></span><br><br>
        <input type="text" id="designation" placeholder="Designation:">
        <span id="designationError"></span><br><br>
    </form>
    <script>
        let username=document.getElementById('username');
        let email=document.getElementById('email');
        let designation=document.getElementById('designation');
        let usererror=document.getElementById('userError');
        let emailerror=document.getElementById('emailError');
        let desigerror=document.getElementById('designationError');
        username.addEventListener('input',function(){
            if(username.value.trim().length<5){
                username.classList.add('invalid');
                usererror.textContent='Min 5 characters required';
            }
            else {
                username.classList.remove('invalid');
                usererror.textContent='';
            }
        });
        email.addEventListener('input', function(){
            if(!email.value.includes('@')){
                email.classList.add('invalid');
                emailerror.textContent='Enter valid email';
            }
            else {
                email.classList.remove('invalid');
                emailerror.textContent='';
            }
        });
        designation.addEventListener('input', function(){
            if(designation.value==='student'){
                designation.classList.add('invalid');
                desigerror.textContent='Student not applicable';
            }
            else {
                designation.classList.remove('invalid');
                desigerror.textContent='';
            }
        });
    </script>
</body>
</html>
