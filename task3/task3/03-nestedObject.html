<!DOCTYPE html>
<html lang="en">
<head>
  <title>Nested shopping cart object</title>
</head>
<body>
  <h2>Nested shopping cart object</h2>
  <script>
    let cart={items:[{ name: "Laptop", price: 75000, quantity: 1 },{ name: "Mouse", price: 1200, quantity: 2 },{ name: "Keyboard", price: 2500, quantity: 1 }]};
    let totalPrice=0;
    for (let i=0;i<cart.items.length;i++){
      let item=cart.items[i];
      totalPrice+=item.price*item.quantity;
    }
    console.log("Total price of cart:₹"+totalPrice);
    cart.items[1].quantity=3;
    totalPrice=0;
    for (let i=0;i<cart.items.length;i++){
      let item=cart.items[i];
      totalPrice+=item.price*item.quantity;
    }
    console.log("Updated total price after changing quantity: ₹"+totalPrice);
  </script>
</body>
</html>
