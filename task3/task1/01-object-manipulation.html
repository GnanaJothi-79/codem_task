<!DOCTYPE html>
<html lang="en">
<head>
  <title>User Profile Object Manipulation</title>
</head>
<body>
  <h2>User profile object manipulation</h2>
  <script>
    let userprofile={name:"Gopal",age:25,email:"gopal@example.com",isActive:true};
    userprofile.name="Jothi";
    userprofile.age=21;
    userprofile["email"]="jothi@example.com";
    userprofile["isActive"]=false;
    userprofile["role"]="Admin";
    console.log("updated userprofile object:");
    for(let key in userprofile) {
      console.log(`${key}:${userprofile[key]}`);
    }
  </script>
</body>
</html>
