<!DOCTYPE html>
<html>
<head>
    <title>Payment Status Checker</title>
</head>
<body style="text-align:center; margin-top:80px; font-family:Arial;">
<h2>Payment Status Checker</h2>
<label>Amount:</label>
<input type="number" id="amount" placeholder="Enter amount">
<br><br>
<label>Is Paid?</label>
<select id="paid">
    <option value="true">Yes</option>
    <option value="false">No</option>
</select>
<br><br>
<label>Payment Method:</label>
<select id="method">
    <option value="UPI">UPI</option>
    <option value="Card">Card</option>
    <option value="Cash">Cash</option>
</select>
<br><br>
<button onclick="runPayment()">Check Payment</button>
<script>
function checkPaymentStatus(amount,isPaid,paymentMethod){
    if(amount<=0||isNaN(amount)){
        console.log("Status:Invalid payment amount");
        return;
    }
    else if(!isPaid){
        console.log("Status:Payment Pending");
    }
    else if(paymentMethod==="UPI"||paymentMethod==="Card"){
        console.log("Status:Payment Successful");
    }
    else{
        console.log("Status:Invalid payment method");
    }
    console.log("Amount:₹"+amount);
    console.log("Method:"+paymentMethod);
}
function runPayment(){
    let amount=parseFloat(document.getElementById("amount").value);
    let isPaid=document.getElementById("paid").value === "true";
    let method=document.getElementById("method").value;
    checkPaymentStatus(amount,isPaid,method);
}
</script>
</body>
</html>
